<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recorridas · Gestión</title>
<link rel="icon" href="/icono.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/estilos.css">
<style>
.wrap{max-width:1280px;margin:0 auto;padding:20px 24px 60px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.head h1{margin:0;font-size:32px;font-weight:600}
.kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--line2);padding:4px;border-radius:12px}
.tabs button{height:40px;padding:0 16px;border:none;border-radius:9px;font-size:15px;font-weight:600;background:transparent;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:#fff;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:500}
.kpi .l{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chipb{height:36px;padding:0 14px;border-radius:18px;font-size:14px;font-weight:600;background:#fff;border:1px solid #C9C7BE}
.chipb[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
th{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);position:sticky;top:0}
td input,td select{height:38px;border:1px solid var(--line2);border-radius:8px;padding:0 9px;font-size:14px;background:#fff}
td input:focus,td select:focus{border-color:var(--green);outline:2px solid #CFE6DA}
td input.saved{border-color:var(--green)} td input.bad{border-color:var(--orange)}
.iconbtn{width:38px;height:38px;border:none;background:transparent;border-radius:8px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--soft);color:var(--orange-ink)}
.fil{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fil select,.fil input{height:40px;border:1px solid #C9C7BE;border-radius:10px;padding:0 10px;font-size:15px;background:#fff}
.map{height:380px;border-radius:14px;border:1px solid var(--line);z-index:0}
.zcard{text-align:left;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;background:#fff;border:2px solid var(--line2);width:100%}
.zcard[aria-pressed="true"]{border-color:var(--ink)}
.zbar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;display:flex}
.thumb{width:56px;height:40px;object-fit:cover;border-radius:6px;cursor:zoom-in;border:none;padding:0;background:#ECEAE3;display:block}
.ev{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid #EFEDE7}
.ev .t{width:52px;flex:none;font-family:var(--mono);font-size:14px;font-weight:500;padding-top:2px}
.dot{width:10px;height:10px;border-radius:5px;margin-top:6px;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:6000;padding:20px;flex-direction:column;gap:10px;color:#fff}
.lb img{max-width:100%;max-height:85vh;border-radius:8px}
.drop{border:1.5px dashed #9AA39D;padding:22px;display:flex;flex-direction:column;gap:10px}
.drop.over{background:var(--green-soft)}
.list-sm{font-size:14px;max-height:220px;overflow:auto;border:1px solid var(--line2);border-radius:10px}
.list-sm div{padding:8px 10px;border-bottom:1px solid var(--line2)}
.muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="muted">Cargando…</div></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/comun.js"></script>
<script src="/panel.js"></script>
</body>
</html>
