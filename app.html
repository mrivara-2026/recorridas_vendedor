<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17201B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Recorridas</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg">
<link rel="apple-touch-icon" href="/icono.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilos.css">
<style>
body{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{background:var(--ink);color:#F3F2EE;padding:calc(env(safe-area-inset-top) + 20px) 20px 18px;display:flex;flex-direction:column;gap:10px}
.top .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#B9C2BC}
.top h1{margin:0;font-size:26px;font-weight:600;line-height:1.15}
.ghost{height:36px;padding:0 10px;border:1px solid #4A564F;border-radius:8px;background:transparent;color:#D5DBD7;font-size:13px}
.bar{height:6px;background:#34403A;border-radius:3px;overflow:hidden}
.bar>div{height:6px;background:#6FCF97;border-radius:3px}
main{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}
.foot{position:sticky;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 16px);background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.big{width:100%;height:56px;border:none;border-radius:14px;font-size:17px;font-weight:600}
.zone{text-align:left;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:#fff;border:2px solid var(--line2);width:100%}
.zone[aria-pressed="true"]{border-color:var(--green)}
.zbar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;display:flex}
.stop{text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:center;min-height:76px;width:100%}
.num{width:28px;height:28px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:500;background:#ECEAE3;color:var(--ink2)}
.num.si{background:var(--green);color:#fff}.num.no{background:var(--orange);color:#fff}
.sec{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font-size:16px;font-weight:600}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{height:60px;border-radius:12px;font-size:20px;font-weight:700;background:#fff}
.yn .s{color:var(--green);border:2px solid var(--green)} .yn .s[aria-pressed="true"]{background:var(--green);color:#fff}
.yn .n{color:var(--orange);border:2px solid var(--orange)} .yn .n[aria-pressed="true"]{background:var(--orange);color:#fff}
.chip{height:36px;padding:0 12px;border-radius:18px;border:1px solid #C9C7BE;background:var(--soft);font-size:14px}
textarea{border:1px solid #C9C7BE;border-radius:10px;padding:12px;font-size:16px;resize:vertical;min-height:84px}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:10px;background:#ECEAE3}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:22px;border:1px solid #C9C7BE;background:#fff;font-size:22px}
.reg{background:var(--green-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.back{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:22px}
.vhead{background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 14px) 12px 14px;display:flex;align-items:center;gap:4px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<div id="root"><div class="empty">Cargando…</div></div>
<script src="/comun.js"></script>
<script src="/app.js"></script>
</body>
</html>
